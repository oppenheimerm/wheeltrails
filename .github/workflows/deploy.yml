name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Blazor WASM
        run: dotnet publish WT/WT.Client/WT.Client.csproj -c Release

      - name: Inject Google Maps API Key into published index.html
        if: ${{ secrets.GOOGLE_MAPS_API_KEY != '' }}
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          FILE="WT/WT.Client/bin/Release/net9.0/publish/wwwroot/index.html"
          if [ -f "$FILE" ]; then
            perl -0777 -pe "s/__GOOGLE_MAPS_API_KEY__/$ENV{GOOGLE_MAPS_API_KEY}/g" -i "$FILE"
            echo "Replaced Google Maps API key in $FILE"
          else
            echo "File not found: $FILE"
            exit 1
          fi

      - name: Upload to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: wheelytrails
          directory: WT/WT.Client/bin/Release/net9.0/publish/wwwroot


