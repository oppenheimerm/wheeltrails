name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Make scripts executable
        run: chmod +x WT/scripts/generate-config.sh || true

      - name: Generate runtime config (repo)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY not set; skipping config generation"
          else
            WT/scripts/generate-config.sh
          fi

      - name: Publish Blazor WASM
        run: dotnet publish WT/WT.Client/WT.Client.csproj -c Release

      - name: Upload to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: wheelytrails
          directory: WT/WT.Client/bin/Release/net9.0/publish/wwwroot


